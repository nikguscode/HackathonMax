openapi: 3.0.4
info:
  title: MaxQueue Orchestrator API
  description: API, which is the entry point to the MaxQueue project
  version: 0.0.1

servers:
  - url: http://orchestrator-service:8080
    description: Development server
  - url: http://localhost:8080
    description: Local server

tags:
  - name: users
    description: Operations related to Max Messenger users
  - name: queue-entries
    description: Operations related to Queue Entries
  - name: organizations
    description: Manage organizations, their queues, settings, and metrics
  - name: queues
    description: Queue-specific operations within organizations

paths:
  /users:
    post:
      tags: [users]
      summary: Add user in maxqueue system
      operationId: addUserInMaxQueueSystem
      requestBody:
        description: Add user in maxqueue system
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreatingRequest'
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{maxId}/mini-app:
    post:
      tags: [users]
      summary: Transfer data after opening the mini-app
      operationId: sendUserMiniAppData
      parameters:
        - name: maxId
          in: path
          required: true
          description: User MAX ID
          schema:
            type: integer
            format: int64
      requestBody:
        description: Transfer data after opening the mini-app
        content:
          application/json:
            schema:
              type: object
              properties:
                miniAppInitData:
                  type: string
              required:
                - miniAppInitData
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{maxId}/role:
    put:
      tags: [users]
      summary: Update user role in organization
      operationId: updateOrganizationUserRole
      parameters:
        - name: maxId
          in: path
          required: true
          description: User MAX ID
          schema:
            type: integer
            format: int64
      requestBody:
        description: Update user role in organization
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
      responses:
        '200':
          description: Organization with its queues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationQueuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /users/{maxId}:
    put:
      tags: [users]
      summary: Update user in maxqueue system
      operationId: updateUserInMaxQueueSystem
      parameters:
        - name: maxId
          in: path
          required: true
          description: Max Messenger user ID
          schema:
            type: integer
            format: int64
      requestBody:
        description: Update user in maxqueue system
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      tags: [users]
      summary: Get user by Max Messenger ID
      operationId: getUserByMaxId
      parameters:
        - name: maxId
          in: path
          required: true
          description: Max Messenger user ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /queue-entries:
    post:
      tags: [queue-entries]
      summary: Add user in queue
      operationId: addQueueEntry
      requestBody:
        description: Add user in queue
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueEntryCreatingRequest'
      responses:
        '201':
          description: User added to queue
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /queue-entries/{entryId}:
    delete:
      tags: [queue-entries]
      summary: Delete user from queue
      operationId: deleteQueueEntry
      parameters:
        - name: entryId
          in: path
          required: true
          description: Queue Entry id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      tags: [queue-entries]
      summary: Get queue entry
      operationId: getQueueEntry
      parameters:
        - name: entryId
          in: path
          required: true
          description: Queue Entry id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /organizations/{organizationId}/queues:
    post:
      tags: [organizations]
      summary: Create queue for organization
      operationId: createOrganizationQueue
      parameters:
        - name: organizationId
          in: path
          required: true
          descripiton: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: Queue created for organization
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

    get:
      tags: [organizations]
      summary: Get list of queues in an organization
      operationId: getOrganizationQueues
      parameters:
        - name: organizationId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: Organization with its queues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /organizations/{organizationId}/settings:
    get:
      tags: [organizations]
      summary: Get organization settings
      operationId: getOrganizationSettings
      parameters:
        - name: organizationId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /organizations/{organizationId}/metrics:
    get:
      tags: [organizations]
      summary: Get organization metrics
      operationId: getOrganizationMetrics
      parameters:
        - name: organizationId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /queues/{queueId}/members:
    get:
      tags: [queues]
      summary: Get members of a queue
      operationId: getQueueMembers
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue members retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMembersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /queues/{queueId}/settings:
    get:
      tags: [queues]
      summary: Get queue settings
      operationId: getQueueSettings
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  #Analytics
  /queues/{queueId}/metrics:
    get:
      tags: [queues]
      summary: Get queue metrics
      operationId: getQueueMetrics
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMetricsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  responses:
    BadRequest:
      description: Invalid request parameters
    NotFound:
      description: Resource not found
    UnexpectedError:
      description: Unexpected server error

  schemas:

    ##### Enums #####
    UserRole:
      type: string
      description: Role of user
      enum:
        - CLIENT
        - EMPLOYEE
        - MODERATOR
        - ADMIN

    QueueEntryStatus:
      type: string
      description: Status of queue entry
      enum:
        - WAITING
        - SERVING
        - SERVED
        - CANCELED
        - MISSED

    ##### Frontend requests #####

    ### User Requests ###

    UserCreatingRequest:
      type: object
      properties:
        maxId:
          type: string
        username:
          type: string
        firstName:
          type: string
        secondName:
          type: string
      required:
        - maxId
      example:
        maxId: 123
        username: asd
        firstName: Alex
        secondName: Novikov

    UserRoleRequest:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
      required:
        - organizationId
        - role

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        firstName:
          type: string
        secondName:
          type: string
        createdAt:
          type: string
          format: date-time
      example:
        username: asd
        firstName: Alex
        secondName: Novikov
        createdAt: 2025-11-09T16:21:09Z

    ### Queue Entry Request ###

    QueueEntryCreatingRequest:
      type: object
      properties:
        maxId:
          type: integer
          format: int64
        queueId:
          type: string
          format: uuid
      required:
        - maxId
        - queueId

    ##### Orchestrator responses #####

    ### User Responses ###

    UserResponse:
      type: object
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        queue-entries:
          type: array
          items:
            $ref: '#/components/schemas/QueueEntryInUserResponse'

    QueueEntryInUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        peopleInFront:
          type: integer
        status:
          $ref: '#/components/schemas/QueueEntryStatus'

    ### Queue Entry Responses ###

    QueueEntryResponse:
      type: object
      properties:
        name:
          type: string
        login:
          type: string
        peopleInFront:
          type: integer
        status:
          $ref: '#/components/schemas/QueueEntryStatus'

    ### Organization Responses ###

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          allOf:
            - $ref: '#/components/schemas/UserRole'
            - enum: [ADMIN, MANAGER]
        amountOfQueues:
          type: integer

    OrganizationQueuesResponse:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: '#/components/schemas/SimpleQueue'


    OrganizationSettingsResponse:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSettings'

    OrganizationSettings:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        isBanned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OrganizationMetricsResponse:
      type: object
      properties:
        metrics:
          $ref: '#/components/schemas/OrganizationMetrics'

    OrganizationMetrics:
      type: object
      properties:
        numberOfActiveQueues:
          type: integer
        numberOfQueues:
          type: integer
        numberOfMembersInAllQueues:
          type: integer
        numberOfEmployees:
          type: integer
        membersInDay:
          type: integer
        waitingTime:
          type: number
          format: float
        averageLoadInQueues:
          type: number
          format: float
        numberOfServedMembers:
          type: integer

    SimpleOrganization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ### Queue Response ###

    SimpleQueue:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Queue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    QueueResponse:
      properties:
        queues:
          type: array
          items:
            $ref: '#/components/schemas/Queue'

    QueueSettingsResponse:
      properties:
        settings:
          $ref: '#/components/schemas/QueueSettings'

    QueueMetricsResponse:
      properties:
        metrics:
          $ref: '#/components/schemas/QueueMetrics'

    QueueMembersResponse:
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/QueueMember'

    QueueSettings:
      type: object
      properties:
        arrivalGracePeriod:
          type: integer
        maxQueueSize:
          type: integer
        isActive:
          type: boolean

    QueueMetrics:
      type: object
      properties:
        waitingTime:
          type: number
          format: float
        membersInFragment:
          type: integer
        entriesInTheQueue:
          type: integer
        numberOfServedMembers:
          type: integer
        serviceTime:
          type: number
          format: float
        totalLeft:
          type: integer
        maxInQueue:
          type: integer
        minInQueue:
          type: integer
        averageInQueue:
          type: integer

    QueueMember:
      type: object
      properties:
        maxId:
          type: integer
          format: int64
        queueEntryId:
          type: string
          format: uuid
        username:
          type: string