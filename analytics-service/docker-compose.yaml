version: "3.9"

services:
  db:
    image: postgres:17.5-alpine
    container_name: db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - local
      - docker

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitpassword}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    profiles:
      - local
      - docker
    
  analytics_service:
    container_name: analytics_service
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - rabbitmq
    environment:
      APP_MODE: http
      DB_HOST: db
      POSTGRES_PORT: 5432
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      HTTP_PORT: 8081
    ports:
      - "8081:8081"
    profiles:
      - local
      - docker

volumes:
  postgres_data:
  rabbitmq_data:
