services:
  db:
    image: postgres:17.5-alpine
    container_name: db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - api-only
      - db-only
      - dev
      - local
      - docker

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitpassword}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    profiles:
      - api-only
      - dev
      - local
      - docker

  redis:
    image: redis:8.2.3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - api-only
      - dev
      - local
      - docker

  pgadmin:
    image: dpage/pgadmin4:8.13
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - api-only
      - dev
      - local
      - db-only

  api:
    container_name: api
    build:
      context: ../orchestrator-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
    ports:
      - "8080:8080"
    profiles:
      - api-only
      - local
      - docker

  frontend:
    build:
      context: ../max-mini-app
      args:
        VITE_API_BASE_PATH: ${VITE_API_BASE_PATH:-/api}
    expose:
      - "80"
    profiles:
      - dev
      - local
      - docker

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - dev
      - local
      - docker

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
