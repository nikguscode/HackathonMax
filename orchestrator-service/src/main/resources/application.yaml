spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: orchestrator-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog.xml

server:
  port: 8080

max:
  bot:
    token: ${MAX_BOT_TOKEN}