<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>max-mini-app</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Проверяем, что объект WebApp существует
      function waitForWebApp(timeout = 5000) {
        return new Promise((resolve, reject) => {
          const start = Date.now();
          const interval = setInterval(() => {
            if (window.WebApp) {
              clearInterval(interval);
              resolve(window.WebApp);
            } else if (Date.now() - start > timeout) {
              clearInterval(interval);
              reject("WebApp не найден");
            }
          }, 50);
        });
      }

      waitForWebApp()
        .then((WebApp) => {
          WebApp.ready(() => {
            console.log("Мини-приложение готово");

            // Кнопка Назад
            WebApp.BackButton.show();
            WebApp.BackButton.onClick(() => WebApp.close());

            // Данные пользователя
            const user = WebApp.initData?.user;
            console.log("InitData:", WebApp.initData); // <- выводим токен
            if (user) {
              console.log("Данные пользователя:", user);

              // Отправка на mock сервер
              fetch("https://webhook.site/5c55aa19-0b6c-4683-8282-ba1ea3460865", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "X-Max-Auth-Data": JSON.stringify(WebApp.initData)
                },
                body: JSON.stringify({
                  userId: user.id,
                  firstName: user.first_name,
                  lastName: user.last_name,
                  username: user.username,
                  timestamp: new Date().toISOString(),
                }),
              })
                .then((res) => res.json())
                .then((data) => console.log("Ответ от бэкенда:", data))
                .catch((err) => console.error("Ошибка отправки на бэкенд:", err));
            } else {
              console.warn("Данные пользователя не найдены");
            }
          });
        })
        .catch((err) => console.error(err));
    </script>
  </body>
</html>
